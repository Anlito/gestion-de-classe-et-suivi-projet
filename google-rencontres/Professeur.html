<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><style>body{font:17px/1.5 system-ui;background:#faf7f2;color:#253047}main{max-width:720px;background:white;padding:24px;border-radius:18px;margin:24px auto}label{display:block;margin:18px 0}input,button{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}input[type=password],input[type=text]{width:100%}button{background:#cec3fa;border:0;border-radius:12px;min-height:48px;cursor:pointer}#message{white-space:pre-wrap}</style></head><body><main><h1>Rencontres PP · espace professeur</h1><p>Les réponses et la clé professeur restent privées. Seul le lien du formulaire est destiné aux familles.</p><label>Clé professeur<input id="key" type="password" autocomplete="off"></label><label>Fichier de campagne exporté depuis le Carnet<input id="file" type="file" accept=".json,application/json"></label><button id="publish">Publier / mettre à jour la campagne</button><p><a id="public" hidden target="_blank" rel="noopener">Ouvrir le formulaire familles</a></p><label>Identifiant de campagne (rempli avec le fichier)<input id="campaign" type="text"></label><button id="download">Télécharger les demandes pour le Carnet</button><p id="message" role="status"></p></main><script>
const message=document.getElementById('message');let payload=null;const key=()=>document.getElementById('key').value;
document.getElementById('file').onchange=async e=>{try{const file=e.target.files[0];if(!file||file.size>100000)throw Error('Fichier absent ou trop volumineux.');payload=JSON.parse(await file.text());document.getElementById('campaign').value=payload.campaignId||'';}catch(err){payload=null;message.textContent=err.message;}};
function run(action,data,success){message.textContent='En cours…';document.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(result=>{document.querySelectorAll('button').forEach(b=>b.disabled=false);if(!result?.ok){message.textContent='Action non confirmée.';return;}success(result);}).withFailureHandler(err=>{document.querySelectorAll('button').forEach(b=>b.disabled=false);message.textContent=err.message||'Action non confirmée.';}).adminAction(key(),action,data);}
document.getElementById('publish').onclick=()=>{if(!payload){message.textContent='Choisissez le fichier de campagne.';return;}run('publish',payload,r=>{const link=document.getElementById('public');link.href=r.publicURL;link.hidden=false;message.textContent=payload.status==='open'?'Campagne publiée. Copiez le lien du formulaire pour les familles.':'Formulaire fermé, réponses conservées.';});};
document.getElementById('download').onclick=()=>run('list',{campaignId:document.getElementById('campaign').value},r=>{const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='demandes-rencontres.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='Fichier téléchargé : importez-le dans la campagne du Carnet.';});
</script></body></html>
