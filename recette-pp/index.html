<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recette PP · données séparées</title>
<meta name="description" content="Carnet de bord de l'enseignant : comportement, séances, groupes et notation. Données stockées sur l'appareil.">
<meta name="theme-color" content="#fbf7f2">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/pp.css">
<script>
  // Thème mémorisé (clé carnet-theme), sinon celui de l'appareil — appliqué avant l'affichage pour éviter un flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('carnet-theme'); } catch (e) {}
    if (t !== 'clair' && t !== 'sombre') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script type="module" src="js/app.js"></script>
<style>body::after{content:"RECETTE PP · données séparées";position:fixed;right:12px;bottom:2px;font:700 11px system-ui;color:#623b00;background:#fff0bd;padding:3px 8px;border-radius:5px;z-index:100000;pointer-events:none}</style>
</head>
<body>
<div id="view"></div>
<div id="alerts"></div>
<div id="layer"></div>
<div id="toast" hidden></div>
<noscript>Le Carnet de classe a besoin de JavaScript pour fonctionner.</noscript>
<script type="module" src="js/recette-setup.js"></script>
</body>
</html>
